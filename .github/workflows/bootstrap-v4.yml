name: Bootstrap V4 source
on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.txt | base64 -d > /tmp/cuphead-v4.zip
          mkdir -p /tmp/cuphead-src
          unzip -q /tmp/cuphead-v4.zip -d /tmp/cuphead-src
          test -f /tmp/cuphead-src/cuphead-v4/package.json
          rsync -a --delete             --exclude '.git/'             --exclude '.github/workflows/bootstrap-v4.yml'             /tmp/cuphead-src/cuphead-v4/ ./
          rm -rf .bootstrap
      - name: Commit complete modular source
        shell: bash
        run: |
          git config user.name "Cup Club Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete Cup Club V4 source" || exit 0
          git push
